name: Custom Pages Jekyll Build

on:
  push:
    branches:
      - keine
      
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          ref: gh-pages

      - name: Setup Ruby 💎
        uses: actions/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Setup Pages 🌐
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll 🛠️
        # Installiert dein Theme und dein Sitemap-Plugin vor dem Build
        run: |
          gem install jekyll jekyll-theme-hacker jekyll-sitemap
          jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact 🚀
        uses: actions/upload-pages-artifact@v5

      - name: Deploy to GitHub Pages 🌍
        id: deployment
        uses: actions/deploy-pages@v5
