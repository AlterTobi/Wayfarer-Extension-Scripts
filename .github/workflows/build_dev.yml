name: DEVELOP build and deploy
on:
  push:
    branches:
      - main
      - 'dev/*'
      - 'issue/*'
      - 'feature/*'
      - 'hotfix/*'
      - 'test/*'

jobs:
  build-and-deploy:
    if: github.actor != 'dependabot[bot]'
    concurrency: ci-${{ github.ref }} # Recommended if you intend to make multiple deployments in quick succession.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install and Build
        env:
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
        run: |
          cd _buildscripts
          /usr/bin/python3 ./build.py -c build_dev.ini

#      - name: Inject Pages Workflow into Build 📦
#        run: |
#          mkdir -p build/.github/workflows
#          cp .github/workflows/jekyll-gh-pages.yml build/.github/workflows/

#      - name: Deploy JS lib
#        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
#        with:
#          server: ${{ secrets.FTP_DEPLOY_SERVER }}
#          username: ${{ secrets.FTP_USERNAME }}
#          password: ${{ secrets.FTP_PASSWORD }}
#          protocol: ftps
#          local-dir: ./_pages/js/
#          state-name:  ${{ secrets.FTP_STATE_NAME }}

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build # The folder the action should deploy.
          branch: gh-pages # The branch the action should deploy to.
          target-folder: dev
          single-commit: true # need no history
          include-github-folder: true # sonst kommt der workflow nicht mit
